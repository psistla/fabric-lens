name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

jobs:
  # ── CI gate ────────────────────────────────────────────────────────────────
  # Runs audit, lint, strict build, and tests before any deployment happens.
  # The deploy job below declares `needs: ci` so a failing CI always blocks
  # both PR preview deployments and production deploys to fabric-lens.com.
  ci:
    name: Security, Lint, Build & Test
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build (strict TypeScript)
        run: npm run build
        env:
          VITE_MSAL_CLIENT_ID: ${{ secrets.VITE_MSAL_CLIENT_ID }}
          VITE_MSAL_TENANT_ID: common
          VITE_MSAL_REDIRECT_URI: https://fabric-lens.com
          VITE_FABRIC_API_BASE: https://api.fabric.microsoft.com/v1
          VITE_ARM_API_BASE: https://management.azure.com

      - name: Test + coverage floor
        run: npm run test:coverage

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright, demo build)
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── Deploy ─────────────────────────────────────────────────────────────────
  # On PR: deploys to an Azure SWA preview environment. GitHub posts the
  #        preview URL as a PR comment — use it for end-to-end testing before
  #        merging. Demo mode works immediately; for auth testing add the
  #        preview URL to the Azure AD App Registration redirect URIs.
  # On merge to master: deploys to the production site (fabric-lens.com).
  # Always requires the CI gate to pass first.
  deploy:
    name: Deploy to Azure SWA
    needs: ci
    # Dependabot runs never receive repo secrets, so the SWA deployment token is
    # empty and the deploy fails. Skip it rather than granting a deployment token
    # to runs whose purpose is pulling in third-party package updates. Dependabot
    # PRs are still gated by the ci job above.
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build and Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_GRASS_0FA393E10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "dist"
        env:
          VITE_MSAL_CLIENT_ID: ${{ secrets.VITE_MSAL_CLIENT_ID }}
          VITE_MSAL_TENANT_ID: common
          VITE_MSAL_REDIRECT_URI: https://fabric-lens.com
          VITE_FABRIC_API_BASE: https://api.fabric.microsoft.com/v1
          VITE_ARM_API_BASE: https://management.azure.com

  # ── Cleanup ─────────────────────────────────────────────────────────────────
  # Tears down the PR preview environment when the pull request is closed.
  close_pull_request_job:
    name: Close Pull Request Preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_GRASS_0FA393E10 }}
          action: "close"
