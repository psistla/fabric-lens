name: Dependency Review

on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest

    # ─── Security rationale ──────────────────────────────────────────────────
    # The Dependency Review action inspects the diff of package-lock.json on
    # every PR and blocks merges that introduce packages with known HIGH or
    # CRITICAL severity vulnerabilities (sourced from the GitHub Advisory DB
    # and OSV). This provides a PR-gate in addition to the post-install
    # `npm audit` check in ci.yml, catching vulnerable additions before they
    # ever land on the default branch.
    # ─────────────────────────────────────────────────────────────────────────
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
